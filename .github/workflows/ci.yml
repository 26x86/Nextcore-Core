name: NextCore Core CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-unknown-uefi
      - run: cargo test --all-targets
      - run: cargo test --no-default-features --test apfs_jumpstart
      - run: cargo check --no-default-features --lib --target x86_64-unknown-uefi
      - name: Firmware-compatible core
        run: cargo check --no-default-features
      - name: Owned guest memory without std and scoped-loan lifetime rejection
        run: |
          cargo test --no-default-features --test guest_memory
          cargo test --no-default-features --doc
